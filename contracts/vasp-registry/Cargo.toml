[package]
name = "vasp-registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
travel-rule-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
travel-rule-common = { path = "../common", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
