name: Feature request
description: Propose a new capability or improvement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change, including contract ABI or storage implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - router contract
        - vasp-registry contract
        - shared types
        - TypeScript SDK
        - off-chain metadata service
        - documentation / CI
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This change may break the existing contract ABI or storage layout
